<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Как устроен перенос</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Данные идут с исходной ВМ прямо в том целевого проекта; облачная учётная запись есть только у оркестратора</text><rect x="30" y="100" width="300" height="330" rx="14" fill="#F1F3F6" stroke="#6B7684" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7684" font-weight="700" text-anchor="start">Исходные ВМ</text><rect x="55" y="145" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="180.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">app01</text><text x="180.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">агент disk2rx</text><rect x="55" y="240" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="180.0" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">db01</text><text x="180.0" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">агент disk2rx</text><text x="180" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">в ЦОДе, другом облаке</text><text x="180" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">или в другом проекте VK Cloud</text><rect x="430" y="100" width="740" height="330" rx="14" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="446" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2458D6" font-weight="700" text-anchor="start">Целевой проект VK Cloud</text><rect x="460" y="145" width="330" height="160" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="625.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">ВМ оркестратора</text><text x="625.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">nginx :443</text><text x="625.0" y="207" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">оркестратор (веб-интерфейс, команда d2g)</text><text x="625.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">приёмник rx0</text><text x="625.0" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">учётная запись облака — только здесь</text><rect x="860" y="145" width="140" height="70" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="930.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">том 1</text><text x="930.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">копия app01</text><rect x="860" y="240" width="140" height="70" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="930.0" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">том 2</text><text x="930.0" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">копия db01</text><rect x="1040" y="190" width="110" height="70" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="1095.0" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="1095.0" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">с тома</text><rect x="460" y="335" width="330" height="70" rx="10" fill="#F7F8FA" stroke="#6B7684" stroke-width="2"/><text x="625.0" y="359" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">администратор</text><text x="625.0" y="379" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">браузер → SSH-туннель → интерфейс</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M305,180 L460,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><rect x="344.1" y="159.0" width="76.8" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="382.5" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">HTTPS 443</text><rect x="354.9" y="177.0" width="55.2" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="382.5" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">(mTLS)</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M305,275 L380,275 L380,230 L460,230" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a2)"/><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M790,180 L860,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a3)"/><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M790,260 L860,275" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a4)"/><defs><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M1000,180 L1040,215" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a5)"/><defs><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7684"/></marker></defs><path d="M625,335 L625,305" fill="none" stroke="#6B7684" stroke-width="2.5" marker-end="url(#a6)"/><circle cx="45" cy="470" r="15" fill="#2458D6"/><text x="45" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="70" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Агент делает снапшот диска и отправляет только занятые блоки.</text><circle cx="45" cy="505" r="15" fill="#2458D6"/><text x="45" y="510" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="70" y="511" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Приёмник записывает их в том; повторные проходы (дельты) передают только изменения.</text><circle cx="640" cy="470" r="15" fill="#1B7F3B"/><text x="640" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="665" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">«Создать ВМ»: том отключается от приёмника,</text><text x="665" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">и из него создаётся новая ВМ.</text></svg>
