<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Как устроен перенос</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Данные идут с исходной ВМ прямо в том целевого проекта; учётная запись облака есть только у оркестратора</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="300" height="300" fill="#F6F7F9" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="4" height="300" fill="#6B7684"/><text x="48" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7684" font-weight="700" text-anchor="start">ИСХОДНЫЕ ВМ</text><rect x="62" y="140" width="240" height="64" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="182.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">app01</text><text x="182.0" y="187.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">агент disk2rx</text><rect x="62" y="240" width="240" height="64" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="182.0" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">db01</text><text x="182.0" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">агент disk2rx</text><text x="182" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">в ЦОДе, другом облаке</text><text x="182" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">или другом проекте VK Cloud</text><rect x="412" y="100" width="756" height="300" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="412" y="100" width="4" height="300" fill="#2458D6"/><text x="428" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ЦЕЛЕВОЙ ПРОЕКТ VK CLOUD</text><rect x="442" y="140" width="280" height="164" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="582.0" y="201.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">ВМ оркестратора</text><text x="582.0" y="220.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">веб-интерфейс и команда d2g</text><text x="582.0" y="237.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">приёмник rx0</text><text x="582.0" y="254.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">учётная запись облака</text><rect x="802" y="140" width="150" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="877.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">том 1</text><text x="877.0" y="187.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копия app01</text><rect x="802" y="240" width="150" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="877.0" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">том 2</text><text x="877.0" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копия db01</text><rect x="998" y="140" width="140" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1068.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="1068.0" y="187.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">из тома 1</text><rect x="442" y="330" width="280" height="50" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="582.0" y="351.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">администратор</text><text x="582.0" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">браузер через SSH-туннель</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M302,172.0 L442,172.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><text x="372" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">HTTPS 443</text><text x="372" y="163.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">mTLS</text><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M302,272.0 L442,272.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M722,172.0 L802,172.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m3)"/><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M722,272.0 L802,272.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M952,172.0 L998,172.0" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m5)"/><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B7684"/></marker></defs><path d="M582.0,330 L582.0,304" fill="none" stroke="#6B7684" stroke-width="1.6" marker-end="url(#m6)"/><circle cx="44" cy="440" r="10" fill="#3A4556"/><text x="44" y="444" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="62" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Агент делает снапшот диска и отправляет только занятые блоки.</text><circle cx="44" cy="470" r="10" fill="#3A4556"/><text x="44" y="474" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="62" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Приёмник записывает их в том; повторные проходы (дельты) передают только изменения.</text><circle cx="644" cy="440" r="10" fill="#1B7F3B"/><text x="644" y="444" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="662" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">«Создать ВМ»: том отключается от приёмника</text><text x="662" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">и становится диском новой ВМ.</text></svg>
