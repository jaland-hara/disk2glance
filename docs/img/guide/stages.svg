<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Этапы переноса одной ВМ</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Исходная ВМ всё это время работает; останавливать приложение нужно только перед последней дельтой (при необходимости)</text><rect x="30" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#6B7684" stroke-width="2"/><text x="116.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Агент</text><text x="116.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">команда из интерфейса,</text><text x="116.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">запуск на исходной ВМ</text><circle cx="50" cy="130" r="15" fill="#3A4556"/><text x="50" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M202,180 L226,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><rect x="226" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="312.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Задание</text><text x="312.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">том по размеру диска</text><text x="312.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">у приёмника</text><circle cx="246" cy="130" r="15" fill="#2458D6"/><text x="246" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M398,180 L422,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a2)"/><rect x="422" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="508.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Первый проход</text><text x="508.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">все занятые блоки</text><text x="508.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">снапшот → том</text><circle cx="442" cy="130" r="15" fill="#2458D6"/><text x="442" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M594,180 L618,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a3)"/><rect x="618" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="704.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Дельты</text><text x="704.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">только изменения,</text><text x="704.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">по расписанию</text><circle cx="638" cy="130" r="15" fill="#2458D6"/><text x="638" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M790,180 L814,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a4)"/><rect x="814" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="900.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Создать ВМ</text><text x="900.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">том отключается,</text><text x="900.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">ВМ создаётся с тома</text><circle cx="834" cy="130" r="15" fill="#1B7F3B"/><text x="834" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><defs><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M986,180 L1010,180" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a5)"/><rect x="1010" y="130" width="172" height="100" rx="10" fill="#FFFFFF" stroke="#6B7684" stroke-width="2"/><text x="1096.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Удалить агента</text><text x="1096.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">с исходной ВМ</text><text x="1096.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">(на копии выключен)</text><circle cx="1030" cy="130" r="15" fill="#3A4556"/><text x="1030" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><defs><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M704,230 L704,275 L758,275 L758,232" fill="none" stroke="#2458D6" stroke-width="2.5" marker-end="url(#a6)"/><rect x="692.6" y="279" width="76.8" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="731" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2458D6" font-weight="400" text-anchor="middle">повторять</text><text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="start">Где смотреть:</text><text x="30" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">1 — вкладка «Исходные ВМ»;  2–4 — «Задания» и «Обзор» (прогресс);  5 — «Задания» → «Создать ВМ»,</text><text x="30" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">ход создания — «Журнал»;  6 — «Исходные ВМ» → «Удалить агента».</text><text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C46A00" font-weight="400" text-anchor="start">После шага 5 новые проходы по этому заданию невозможны: том уже стал диском новой ВМ.</text></svg>
