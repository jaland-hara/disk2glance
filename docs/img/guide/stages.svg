<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Этапы переноса одной ВМ</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Исходная ВМ всё это время работает; приложение останавливают только перед последней дельтой, если нужно</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="116.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Агент</text><text x="116.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">команда из интерфейса,</text><text x="116.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">запуск на исходной ВМ</text><circle cx="46" cy="120" r="10" fill="#3A4556"/><text x="46" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><rect x="226" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="310.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Задание</text><text x="310.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">том по размеру диска</text><text x="310.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">у приёмника</text><circle cx="240" cy="120" r="10" fill="#2458D6"/><text x="240" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><rect x="420" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="504.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Первый проход</text><text x="504.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">все занятые блоки</text><text x="504.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">снапшот → том</text><circle cx="434" cy="120" r="10" fill="#2458D6"/><text x="434" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><rect x="614" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="698.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Дельты</text><text x="698.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">только изменения,</text><text x="698.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">по расписанию</text><circle cx="628" cy="120" r="10" fill="#2458D6"/><text x="628" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><rect x="808" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="892.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Создать ВМ</text><text x="892.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">том отключается,</text><text x="892.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">ВМ создаётся с тома</text><circle cx="822" cy="120" r="10" fill="#1B7F3B"/><text x="822" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><rect x="1002" y="120" width="168" height="84" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="1086.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Удалить агента</text><text x="1086.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">с исходной ВМ</text><text x="1086.0" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">(на копии выключен)</text><circle cx="1016" cy="120" r="10" fill="#3A4556"/><text x="1016" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M200,162.0 L226,162.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M394,162.0 L420,162.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M588,162.0 L614,162.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m3)"/><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M782,162.0 L808,162.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M976,162.0 L1002,162.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m5)"/><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M664.4,204 L664.4,240 L731.6,240 L731.6,204" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m6)"/><text x="698.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2458D6" font-weight="400" text-anchor="middle">повторять</text><text x="32" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="700" text-anchor="start">Где смотреть:</text><text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="start">1 — вкладка «Исходные ВМ»;  2–4 — «Задания» и «Обзор»;  5 — «Задания» → «Создать ВМ», ход — «Журнал»;</text><text x="32" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="start">6 — «Исходные ВМ» → «Удалить агента».</text><text x="32" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B35A00" font-weight="400" text-anchor="start">После шага 5 новые проходы по этому заданию невозможны: том уже стал диском новой ВМ.</text></svg>
