<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Проброс порта через джамп-хост</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">У оркестратора нет FIP: SSH идёт через джамп-хост, который только пересылает зашифрованное соединение</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="340" height="150" fill="#F6F7F9" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="4" height="150" fill="#6B7684"/><text x="48" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7684" font-weight="700" text-anchor="start">КОМПЬЮТЕР АДМИНИСТРАТОРА</text><rect x="56" y="146" width="140" height="70" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="126.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">браузер</text><text x="126.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">localhost:8443</text><rect x="216" y="146" width="140" height="70" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="286.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">ssh -J -L</text><text x="286.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">8443 → 127.0.0.1:443</text><rect x="452" y="100" width="240" height="150" fill="#F6F2FB" stroke="#C9D1DC" stroke-width="1"/><rect x="452" y="100" width="4" height="150" fill="#6B3FA0"/><text x="468" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B3FA0" font-weight="700" text-anchor="start">ДЖАМП-ХОСТ</text><rect x="476" y="146" width="192" height="70" rx="3" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="1.4"/><text x="572.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">sshd</text><text x="572.0" y="187.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">FIP 203.0.113.20</text><text x="572.0" y="204.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">серый 10.0.10.5</text><rect x="772" y="100" width="396" height="150" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="772" y="100" width="4" height="150" fill="#2458D6"/><text x="788" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ВМ ОРКЕСТРАТОРА, БЕЗ FIP</text><rect x="796" y="146" width="160" height="70" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="876.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">sshd</text><text x="876.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">серый 10.0.10.8</text><rect x="980" y="146" width="164" height="70" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="1062.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">nginx и d2g</text><text x="1062.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">127.0.0.1:443</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M196,181.0 L216,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M356,181.0 L476,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><text x="412" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">SSH 22</text><text x="412" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">по FIP</text><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B3FA0"/></marker></defs><path d="M668,181.0 L796,181.0" fill="none" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#m3)"/><text x="732" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B3FA0" font-weight="400" text-anchor="middle">SSH 22</text><text x="732" y="165" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B3FA0" font-weight="400" text-anchor="middle">по серому</text><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M956,181.0 L980,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><line x1="216" y1="272" x2="956" y2="272" stroke="#1B7F3B" stroke-width="2"/><text x="586" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1B7F3B" font-weight="400" text-anchor="middle">одно SSH-соединение от вашего компьютера до оркестратора: джамп-хост его не расшифровывает</text><text x="32" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="700" text-anchor="start">Команда на компьютере администратора:</text><text x="32" y="366" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">ssh -J ubuntu@203.0.113.20 -L 8443:127.0.0.1:443 ubuntu@10.0.10.8</text><text x="32" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="start">Веб-интерфейс видит обращение с 127.0.0.1, как при прямом туннеле, поэтому список «Веб-интерфейс открыт для» менять не нужно.</text></svg>
