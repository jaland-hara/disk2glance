<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Как открыть веб-интерфейс через SSH-туннель</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Порт 443 наружу открывать не нужно: браузер подключается через SSH, интерфейс видит обращение с 127.0.0.1</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="400" height="150" fill="#F6F7F9" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="4" height="150" fill="#6B7684"/><text x="48" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7684" font-weight="700" text-anchor="start">КОМПЬЮТЕР АДМИНИСТРАТОРА</text><rect x="56" y="146" width="168" height="70" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="140.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">браузер</text><text x="140.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">https://localhost:8443</text><rect x="244" y="146" width="168" height="70" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="328.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">ssh -L</text><text x="328.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">8443 → 127.0.0.1:443</text><rect x="552" y="100" width="616" height="150" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="552" y="100" width="4" height="150" fill="#2458D6"/><text x="568" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ВМ ОРКЕСТРАТОРА (FIP 203.0.113.10)</text><rect x="576" y="146" width="168" height="70" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="660.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">sshd</text><text x="660.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">порт 22, вход по ключу</text><rect x="764" y="146" width="168" height="70" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="848.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">nginx</text><text x="848.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">127.0.0.1:443</text><rect x="952" y="146" width="192" height="70" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="1048.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">веб-интерфейс</text><text x="1048.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">d2g</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M224,181.0 L244,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M412,181.0 L576,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><text x="492" y="173" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">SSH, порт 22</text><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M744,181.0 L764,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m3)"/><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M932,181.0 L952,181.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><text x="32" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="700" text-anchor="start">Команда на компьютере администратора:</text><text x="32" y="326" font-family="Menlo, Consolas, monospace" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">ssh -i ~/.ssh/&lt;ключ&gt; -L 8443:127.0.0.1:443 ubuntu@203.0.113.10</text></svg>
