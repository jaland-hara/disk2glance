<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Как открыть веб-интерфейс через SSH-туннель</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Порт 443 наружу открывать не нужно: браузер подключается через SSH, интерфейс видит обращение с 127.0.0.1</text><rect x="30" y="100" width="400" height="210" rx="14" fill="#F1F3F6" stroke="#6B7684" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6B7684" font-weight="700" text-anchor="start">Компьютер администратора</text><rect x="55" y="145" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="135.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">браузер</text><text x="135.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">https://localhost:8443</text><rect x="250" y="145" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="330.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">ssh -L</text><text x="330.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">8443 → 127.0.0.1:443</text><rect x="560" y="100" width="610" height="210" rx="14" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="576" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2458D6" font-weight="700" text-anchor="start">ВМ оркестратора (FIP 203.0.113.10)</text><rect x="590" y="145" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="670.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">sshd :22</text><text x="670.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">вход по ключу</text><rect x="800" y="145" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="880.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">nginx :443</text><text x="880.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">127.0.0.1</text><rect x="990" y="145" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="1070.0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">веб-интерфейс</text><text x="1070.0" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">d2g</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M215,185 L250,185" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M410,185 L590,185" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a2)"/><rect x="450.8" y="164.0" width="98.4" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="500.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">SSH, порт 22</text><rect x="443.6" y="182.0" width="112.8" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="500.0" y="195.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">через интернет</text><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M750,185 L800,185" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a3)"/><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M960,185 L990,185" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a4)"/><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="start">Команда на компьютере администратора:</text><text x="30" y="376" font-family="Menlo, Consolas, monospace" font-size="15" fill="#1C2430" font-weight="400" text-anchor="start">ssh -i ~/.ssh/&lt;ключ&gt; -L 8443:127.0.0.1:443 ubuntu@203.0.113.10</text></svg>
