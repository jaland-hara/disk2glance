<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Перенос в другой проект</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Оркестратор один; для каждого проекта на вкладке «Проекты» добавляется его служебная учётная запись</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><text x="32" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2458D6" font-weight="700" text-anchor="start">А. Передача тома — проект в том же регионе</text><rect x="32" y="124" width="520" height="150" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="124" width="4" height="150" fill="#2458D6"/><text x="48" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ПРОЕКТ ОРКЕСТРАТОРА</text><rect x="60" y="170" width="180" height="64" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="150.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">приёмник rx0</text><text x="150.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">принимает диск</text><rect x="340" y="170" width="180" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="430.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="430.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><rect x="648" y="124" width="520" height="150" fill="#F6F2FB" stroke="#C9D1DC" stroke-width="1"/><rect x="648" y="124" width="4" height="150" fill="#6B3FA0"/><text x="664" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B3FA0" font-weight="700" text-anchor="start">ПРОЕКТ КЛИЕНТА, ТОТ ЖЕ РЕГИОН</text><rect x="680" y="170" width="180" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="770.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="770.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">тот же том</text><rect x="960" y="170" width="180" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1050.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="1050.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">из тома</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M240,202.0 L340,202.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B3FA0"/></marker></defs><path d="M520,202.0 L680,202.0" fill="none" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#m2)"/><text x="600" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B3FA0" font-weight="400" text-anchor="middle">передача тома</text><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M860,202.0 L960,202.0" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m3)"/><text x="60" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="start">В проекте клиента не нужны ни приёмник, ни FIP. Режим ещё не проверен на стенде.</text><text x="32" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#B35A00" font-weight="700" text-anchor="start">Б. Свой приёмник — другой регион или данные не должны попадать в проект оркестратора</text><rect x="32" y="342" width="330" height="170" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="342" width="4" height="170" fill="#2458D6"/><text x="48" y="364" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ПРОЕКТ ОРКЕСТРАТОРА</text><rect x="60" y="396" width="270" height="64" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="195.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">оркестратор</text><text x="195.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">управляет, данных не принимает</text><rect x="458" y="342" width="710" height="170" fill="#FDF5EC" stroke="#C9D1DC" stroke-width="1"/><rect x="458" y="342" width="4" height="170" fill="#B35A00"/><text x="474" y="364" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#B35A00" font-weight="700" text-anchor="start">ПРОЕКТ КЛИЕНТА, ЛЮБОЙ РЕГИОН</text><rect x="486" y="396" width="190" height="64" rx="3" fill="#FFFFFF" stroke="#B35A00" stroke-width="1.4"/><text x="581.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">приёмник</text><text x="581.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">создан оркестратором</text><rect x="736" y="396" width="160" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="816.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="816.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><rect x="960" y="396" width="180" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1050.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="1050.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">из тома</text><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B7684"/></marker></defs><path d="M486,428.0 L330,428.0" fill="none" stroke="#6B7684" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m4)"/><text x="408" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7684" font-weight="400" text-anchor="middle">управление</text><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M676,428.0 L736,428.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m5)"/><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M896,428.0 L960,428.0" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m6)"/><text x="486" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="start">Исходные ВМ отправляют диск прямо на этот приёмник: по серому адресу или его FIP.</text></svg>
