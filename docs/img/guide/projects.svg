<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Перенос в другой проект</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Оркестратор один; для каждого проекта на вкладке «Проекты» добавляется его служебная учётная запись</text><text x="30" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2458D6" font-weight="700" text-anchor="start">А. Передача тома — проект в том же регионе</text><rect x="30" y="130" width="560" height="200" rx="14" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2458D6" font-weight="700" text-anchor="start">Проект оркестратора</text><rect x="60" y="175" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="145.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">приёмник rx0</text><text x="145.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">принимает диск</text><rect x="290" y="175" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="360.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="360.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><rect x="650" y="130" width="520" height="200" rx="14" fill="#F3ECFB" stroke="#7A3DB8" stroke-width="2" stroke-dasharray="8 6"/><text x="666" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7A3DB8" font-weight="700" text-anchor="start">Проект клиента (тот же регион)</text><rect x="690" y="175" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="760.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="760.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">тот же том</text><rect x="900" y="175" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="980.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="980.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">с тома</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M230,215 L290,215" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A3DB8"/></marker></defs><path d="M430,215 L690,215" fill="none" stroke="#7A3DB8" stroke-width="2.5" marker-end="url(#a2)"/><rect x="507.2" y="194.0" width="105.60000000000001" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="560.0" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A3DB8" font-weight="400" text-anchor="middle">передача тома</text><rect x="492.8" y="212.0" width="134.4" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="560.0" y="225.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A3DB8" font-weight="400" text-anchor="middle">(Cinder transfer)</text><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M830,215 L900,215" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a3)"/><text x="60" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="start">В проекте клиента не нужны ни приёмник, ни FIP. Режим ещё не проверен на стенде.</text><text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#C46A00" font-weight="700" text-anchor="start">Б. Свой приёмник — другой регион или данные не должны попадать в проект оркестратора</text><rect x="30" y="395" width="380" height="200" rx="14" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="421" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2458D6" font-weight="700" text-anchor="start">Проект оркестратора</text><rect x="60" y="440" width="320" height="80" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="220.0" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">оркестратор</text><text x="220.0" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">управляет, данных не принимает</text><rect x="470" y="395" width="700" height="200" rx="14" fill="#FDF1E3" stroke="#C46A00" stroke-width="2" stroke-dasharray="8 6"/><text x="486" y="421" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C46A00" font-weight="700" text-anchor="start">Проект клиента (любой регион)</text><rect x="500" y="440" width="180" height="80" rx="10" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/><text x="590.0" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">приёмник</text><text x="590.0" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">создан оркестратором</text><rect x="740" y="440" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="810.0" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">том</text><text x="810.0" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><rect x="940" y="440" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="1020.0" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">новая ВМ</text><text x="1020.0" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">с тома</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7684"/></marker></defs><path d="M500,470 L380,470" fill="none" stroke="#6B7684" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a4)"/><rect x="398.0" y="424" width="84.0" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="440" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7684" font-weight="400" text-anchor="middle">управление</text><rect x="383.6" y="442" width="112.8" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="440" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7684" font-weight="400" text-anchor="middle">через интернет</text><defs><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M680,480 L740,480" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a5)"/><defs><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M880,480 L940,480" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a6)"/><text x="500" y="565" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="start">Исходные ВМ отправляют диск прямо на этот приёмник (по серому адресу или его FIP).</text></svg>
