<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Как передаются данные: части, блоки и журнал</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Передаётся только то, чего ещё нет на томе; каждый блок проверяется при записи</text><text x="40" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="start">Диск делится на части по 64 МиБ</text><rect x="40" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="115" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">часть 1</text><rect x="200" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="275" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">часть 2</text><rect x="360" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="435" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">часть 3</text><rect x="520" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="595" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">…</text><rect x="680" y="130" width="150" height="40" rx="4" fill="#EAF0FD" stroke="#2458D6" stroke-width="1.5"/><text x="755" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">часть k</text><rect x="840" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="915" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">…</text><rect x="1000" y="130" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.5"/><text x="1075" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="middle">часть N</text><line x1="680" y1="170" x2="40" y2="200" stroke="#2458D6" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="830" y1="170" x2="1160" y2="200" stroke="#2458D6" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="40" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="72" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">0</text><rect x="110" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="142" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">1</text><rect x="180" y="205" width="64" height="46" rx="4" fill="#2458D6" stroke="#2458D6" stroke-width="1.5"/><text x="212" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">2</text><rect x="250" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="282" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">3</text><rect x="320" y="205" width="64" height="46" rx="4" fill="#FFF7E6" stroke="#C46A00" stroke-width="1.5"/><text x="352" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">4</text><rect x="390" y="205" width="64" height="46" rx="4" fill="#FFF7E6" stroke="#C46A00" stroke-width="1.5"/><text x="422" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">5</text><rect x="460" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="492" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">6</text><rect x="530" y="205" width="64" height="46" rx="4" fill="#2458D6" stroke="#2458D6" stroke-width="1.5"/><text x="562" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">7</text><rect x="600" y="205" width="64" height="46" rx="4" fill="#2458D6" stroke="#2458D6" stroke-width="1.5"/><text x="632" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">8</text><rect x="670" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="702" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">9</text><rect x="740" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="772" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">10</text><rect x="810" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="842" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">11</text><rect x="880" y="205" width="64" height="46" rx="4" fill="#FFF7E6" stroke="#C46A00" stroke-width="1.5"/><text x="912" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">12</text><rect x="950" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="982" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">13</text><rect x="1020" y="205" width="64" height="46" rx="4" fill="#2458D6" stroke="#2458D6" stroke-width="1.5"/><text x="1052" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">14</text><rect x="1090" y="205" width="64" height="46" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="1122" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">15</text><text x="40" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="start">Часть = 16 блоков по 4 МиБ. Для каждого блока агент считает MD5 и сравнивает с журналом приёмника:</text><rect x="40" y="296" width="22" height="18" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">MD5 совпал с журналом — блок не передаётся</text><rect x="430" y="296" width="22" height="18" rx="4" fill="#FFF7E6" stroke="#C46A00" stroke-width="1.5"/><text x="460" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">блок из нулей — передаётся только отметка</text><rect x="820" y="296" width="22" height="18" rx="4" fill="#2458D6" stroke="#2458D6" stroke-width="1.5"/><text x="850" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">изменился — передаётся</text><rect x="40" y="380" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#6B7684" stroke-width="2"/><text x="205.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Агент (исходная ВМ)</text><text x="205.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">читает часть со снапшота</text><text x="205.0" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">MD5 каждого блока</text><text x="205.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">отправляет изменённые блоки</text><text x="205.0" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">одним запросом на часть</text><text x="205.0" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">8–32 части параллельно</text><rect x="470" y="380" width="330" height="150" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="635.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Приёмник</text><text x="635.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">пишет блоки в том по смещению</text><text x="635.0" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">в обход кэша (O_DIRECT)</text><text x="635.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">считает MD5 при записи</text><text x="635.0" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">MD5 не совпал → часть забыта,</text><text x="635.0" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">её передадут целиком заново</text><rect x="900" y="380" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#7A3DB8" stroke-width="2"/><text x="1030.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Журнал приёмника</text><text x="1030.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">MD5 всех блоков на томе</text><rect x="900" y="470" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="1030.0" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Том Cinder</text><text x="1030.0" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M370,455 L470,455" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><rect x="396.0" y="427" width="48.0" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="420" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">часть</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A3DB8"/></marker></defs><path d="M800,410 L900,410" fill="none" stroke="#7A3DB8" stroke-width="2.5" marker-end="url(#a2)"/><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A3DB8"/></marker></defs><path d="M1030,380 L1030,350 L205,350 L205,380" fill="none" stroke="#7A3DB8" stroke-width="2.5" marker-end="url(#a3)"/><rect x="524.0" y="323" width="192.0" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="620" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A3DB8" font-weight="400" text-anchor="middle">журнал — в начале прохода</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M800,500 L900,500" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a4)"/><text x="40" y="580" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Конец прохода: агент отправляет для каждой части MD5 её списка блоков, приёмник сверяет со своим журналом.</text><text x="40" y="604" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Если чего-то не хватает или не совпадает — эти части передаются ещё раз (до трёх кругов). Только после полной сверки</text><text x="40" y="628" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">задание получает состояние «Синхронизировано», и из тома можно создавать ВМ.</text><text x="40" y="666" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">MD5 здесь — проверка от случайной порчи данных; защиту от подмены обеспечивает TLS с проверкой сертификатов обеими сторонами.</text></svg>
