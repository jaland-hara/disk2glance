<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Как передаются данные: части, блоки и журнал</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Передаётся только то, чего ещё нет на томе; каждый блок проверяется при записи</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><text x="32" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="700" text-anchor="start">Диск делится на части по 64 МиБ</text><rect x="32" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="108" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">часть 1</text><rect x="194" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="270" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">часть 2</text><rect x="356" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="432" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">часть 3</text><rect x="518" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="594" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">…</text><rect x="680" y="124" width="152" height="34" rx="2" fill="#F2F6FE" stroke="#2458D6" stroke-width="1.2"/><text x="756" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">часть k</text><rect x="842" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="918" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">…</text><rect x="1004" y="124" width="152" height="34" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="1080" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="middle">часть N</text><line x1="680" y1="158" x2="32" y2="190" stroke="#2458D6" stroke-width="1" stroke-dasharray="5 4"/><line x1="832" y1="158" x2="1168" y2="190" stroke="#2458D6" stroke-width="1" stroke-dasharray="5 4"/><rect x="32.0" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="64.6875" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">0</text><rect x="103.375" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="136.0625" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">1</text><rect x="174.75" y="192" width="65.375" height="40" rx="2" fill="#2458D6" stroke="#2458D6" stroke-width="1.2"/><text x="207.4375" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">2</text><rect x="246.125" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="278.8125" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">3</text><rect x="317.5" y="192" width="65.375" height="40" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1.2"/><text x="350.1875" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">4</text><rect x="388.875" y="192" width="65.375" height="40" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1.2"/><text x="421.5625" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">5</text><rect x="460.25" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="492.9375" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">6</text><rect x="531.625" y="192" width="65.375" height="40" rx="2" fill="#2458D6" stroke="#2458D6" stroke-width="1.2"/><text x="564.3125" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">7</text><rect x="603.0" y="192" width="65.375" height="40" rx="2" fill="#2458D6" stroke="#2458D6" stroke-width="1.2"/><text x="635.6875" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">8</text><rect x="674.375" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="707.0625" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">9</text><rect x="745.75" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="778.4375" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">10</text><rect x="817.125" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="849.8125" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">11</text><rect x="888.5" y="192" width="65.375" height="40" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1.2"/><text x="921.1875" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">12</text><rect x="959.875" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="992.5625" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">13</text><rect x="1031.25" y="192" width="65.375" height="40" rx="2" fill="#2458D6" stroke="#2458D6" stroke-width="1.2"/><text x="1063.9375" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">14</text><rect x="1102.625" y="192" width="65.375" height="40" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1.2"/><text x="1135.3125" y="217" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">15</text><text x="32" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="700" text-anchor="start">Часть = 16 блоков по 4 МиБ. Для каждого блока агент считает MD5 и сравнивает с журналом приёмника:</text><rect x="32" y="276" width="18" height="14" rx="2" fill="#F1F3F6" stroke="#AEB6C2" stroke-width="1"/><text x="58" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">MD5 совпал с журналом — блок не передаётся</text><rect x="420" y="276" width="18" height="14" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1"/><text x="446" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">блок из нулей — передаётся только отметка</text><rect x="810" y="276" width="18" height="14" rx="2" fill="#2458D6" stroke="#2458D6" stroke-width="1"/><text x="836" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">изменился — передаётся</text><rect x="32" y="360" width="300" height="130" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="182.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Агент</text><text x="182.0" y="423.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">читает часть со снапшота</text><text x="182.0" y="440.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">MD5 каждого блока</text><text x="182.0" y="457.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">8–32 части параллельно</text><rect x="450" y="360" width="300" height="130" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="600.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Приёмник</text><text x="600.0" y="423.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">пишет блоки в том по смещению</text><text x="600.0" y="440.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">считает MD5 при записи</text><text x="600.0" y="457.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">не совпало → часть заново</text><rect x="868" y="360" width="300" height="56" rx="3" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="1.4"/><text x="1018.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Журнал приёмника</text><text x="1018.0" y="403.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">MD5 всех блоков на томе</text><rect x="868" y="434" width="300" height="56" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1018.0" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Том Cinder</text><text x="1018.0" y="477.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копия диска</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M332,457.5 L450,457.5" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><text x="391" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">изменённые</text><text x="391" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">блоки и MD5</text><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B3FA0"/></marker></defs><path d="M750,386.0 L868,386.0" fill="none" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M750,470.5 L868,470.5" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m3)"/><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B3FA0"/></marker></defs><path d="M1018.0,360 L1018.0,330 L182.0,330 L182.0,360" fill="none" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#m4)"/><text x="600" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B3FA0" font-weight="400" text-anchor="middle">журнал — в начале прохода</text><text x="32" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Конец прохода: агент отправляет для каждой части MD5 её списка блоков, приёмник сверяет со своим журналом.</text><text x="32" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Чего не хватает или что не совпало, передаётся ещё раз (до трёх кругов). Только после полной сверки задание</text><text x="32" y="592" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">получает состояние «Синхронизировано», и из тома можно создать ВМ.</text><text x="32" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="start">MD5 здесь — проверка от случайной порчи данных; от подмены защищает TLS с проверкой сертификатов обеими сторонами.</text></svg>
