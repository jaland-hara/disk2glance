<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Один проход по шагам</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Управление идёт через оркестратор, данные — напрямую на приёмник</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="100" y="100" width="200" height="50" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="200.0" y="121.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Агент</text><text x="200.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">исходная ВМ</text><line x1="200" y1="150" x2="200" y2="640" stroke="#C9D1DC" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="500" y="100" width="200" height="50" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="600.0" y="129.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Оркестратор</text><line x1="600" y1="150" x2="600" y2="640" stroke="#C9D1DC" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="900" y="100" width="200" height="50" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="1000.0" y="129.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Приёмник</text><line x1="1000" y1="150" x2="1000" y2="640" stroke="#C9D1DC" stroke-width="1.2" stroke-dasharray="5 4"/><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M206,190 L594,190" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><text x="400.0" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">1. Задание: том, адреса приёмника, размер части</text><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M206,235 L994,235" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m2)"/><text x="600.0" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">2. Проверка пути: первый ответивший адрес приёмника</text><rect x="194" y="266" width="12" height="26" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="218" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">3. sync, снапшоты всех смонтированных ФС</text><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M206,325 L994,325" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m3)"/><text x="600.0" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">4. Начало прохода: время снапшота</text><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M994,370 L206,370" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m4)"/><text x="600.0" y="363" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">5. Журнал: MD5 блоков, которые уже есть на томе</text><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M206,415 L994,415" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m5)"/><text x="600.0" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">6. Части с изменёнными блоками, 8–32 потока</text><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M206,460 L994,460" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m6)"/><text x="600.0" y="453" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">7. Сверка: MD5 списков блоков всех частей</text><defs><marker id="m7" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#2458D6"/></marker></defs><path d="M994,505 L206,505" fill="none" stroke="#2458D6" stroke-width="1.6" marker-end="url(#m7)"/><text x="600.0" y="498" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">8. «Синхронизировано» или список частей для повтора</text><rect x="194" y="536" width="12" height="26" rx="2" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.2"/><text x="218" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">9. Удаление снапшотов, возврат настроек</text><defs><marker id="m8" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M206,595 L594,595" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m8)"/><text x="400.0" y="588" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1C2430" font-weight="400" text-anchor="middle">10. Отчёт: сколько передано, за сколько, ошибки</text></svg>
