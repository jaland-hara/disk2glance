<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Один проход по шагам</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Управление идёт через оркестратор, данные — напрямую на приёмник</text><rect x="90" y="95" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#6B7684" stroke-width="2"/><text x="200.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Агент</text><text x="200.0" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">исходная ВМ</text><line x1="200" y1="151" x2="200" y2="670" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="490" y="95" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="600.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Оркестратор</text><line x1="600" y1="151" x2="600" y2="670" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="890" y="95" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="1000.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Приёмник</text><line x1="1000" y1="151" x2="1000" y2="670" stroke="#B8C0CC" stroke-width="1.5" stroke-dasharray="6 5"/><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M208,190 L592,190" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#a1)"/><rect x="221.45000000000002" y="164" width="357.09999999999997" height="19" rx="4" fill="#FFFFFF"/><text x="400.0" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">1. Задание: том, адреса приёмника, размер части</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M208,238 L992,238" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a2)"/><rect x="406.85" y="212" width="386.3" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">2. Проверка пути: первый ответивший адрес приёмника</text><rect x="190" y="272" width="20" height="28" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="224" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">3. sync, снапшоты всех смонтированных ФС</text><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M208,334 L992,334" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a3)"/><rect x="472.55" y="308" width="254.9" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">4. Начало прохода: время снапшота</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M992,382 L208,382" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a4)"/><rect x="421.45000000000005" y="356" width="357.09999999999997" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">5. Журнал: MD5 блоков, которые уже есть на томе</text><defs><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M208,430 L992,430" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a5)"/><rect x="436.05" y="404" width="327.9" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">6. Части с изменёнными блоками, 8–32 потока</text><defs><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M208,478 L992,478" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a6)"/><rect x="443.35" y="452" width="313.3" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">7. Сверка: MD5 списков блоков всех частей</text><defs><marker id="a7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2458D6"/></marker></defs><path d="M992,526 L208,526" fill="none" stroke="#2458D6" stroke-width="2" marker-end="url(#a7)"/><rect x="406.85" y="500" width="386.3" height="19" rx="4" fill="#FFFFFF"/><text x="600.0" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">8. «Синхронизировано» или список частей для повтора</text><rect x="190" y="560" width="20" height="28" rx="4" fill="#F1F3F6" stroke="#3A4556" stroke-width="1.5"/><text x="224" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">9. Удаление снапшотов, возврат настроек</text><defs><marker id="a8" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M208,622 L592,622" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#a8)"/><rect x="221.45000000000002" y="596" width="357.09999999999997" height="19" rx="4" fill="#FFFFFF"/><text x="400.0" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1C2430" font-weight="400" text-anchor="middle">10. Отчёт: сколько передано, за сколько, ошибки</text></svg>
