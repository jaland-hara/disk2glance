<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Передача по частной сети</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Данные дисков идут только по Direct Connect, VPN или сети проекта; исходным ВМ интернет не нужен</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="300" height="300" fill="#F6F7F9" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="100" width="4" height="300" fill="#6B7684"/><text x="48" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7684" font-weight="700" text-anchor="start">ЦОД ИЛИ ОФИС</text><rect x="60" y="150" width="244" height="60" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="182.0" y="176.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">app01</text><text x="182.0" y="195.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">агент, серый адрес</text><rect x="60" y="250" width="244" height="60" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="182.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">db01</text><text x="182.0" y="295.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">агент, серый адрес</text><text x="182" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">только исходящий TCP 443</text><rect x="392" y="196" width="176" height="68" rx="3" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="1.4"/><text x="480.0" y="226.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Direct Connect</text><text x="480.0" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">или VPN (IPsec)</text><rect x="628" y="100" width="540" height="300" fill="#F2F6FE" stroke="#C9D1DC" stroke-width="1"/><rect x="628" y="100" width="4" height="300" fill="#2458D6"/><text x="644" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2458D6" font-weight="700" text-anchor="start">ПРОЕКТ VK CLOUD, СЕТЬ 10.0.10.0/24</text><rect x="660" y="150" width="240" height="82" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="780.0" y="178.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">ВМ оркестратора</text><text x="780.0" y="197.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">10.0.10.8</text><text x="780.0" y="214.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">приёмник rx0</text><rect x="660" y="290" width="240" height="60" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="780.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">приёмник rx1</text><text x="780.0" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">10.0.10.21</text><rect x="960" y="150" width="180" height="82" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1050.0" y="187.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">тома</text><text x="1050.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">копии дисков</text><rect x="960" y="440" width="208" height="60" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4" stroke-dasharray="5 4"/><text x="1064.0" y="466.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">API VK Cloud</text><text x="1064.0" y="485.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">публичные адреса</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M304,180.0 L350,180.0 L350,216.4 L392,216.4" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M304,280.0 L350,280.0 L350,243.6 L392,243.6" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M568,216.4 L614,216.4 L614,191.0 L660,191.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m3)"/><text x="598" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="end">443, mTLS</text><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M568,243.6 L614,243.6 L614,320.0 L660,320.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M900,191.0 L960,191.0" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m5)"/><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M900,320.0 L996.0,320.0 L996.0,232" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m6)"/><defs><marker id="m7" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B7684"/></marker></defs><path d="M864.0,232 L864.0,262 L1136.8,262 L1136.8,440" fill="none" stroke="#6B7684" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m7)"/><text x="1126.8" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="end">только запросы к API облака</text><text x="32" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Агент и модуль ядра исходная ВМ получает с оркестратора по серому адресу.</text><text x="32" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Путь «серый IP приёмника» закрепляется при добавлении ВМ — тогда агент не пробует публичные адреса.</text><text x="32" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Оркестратору FIP не обязателен; API облака он вызывает через маршрутизатор сети (SNAT).</text></svg>
