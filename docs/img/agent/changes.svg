<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Что меняется на исходной ВМ во время прохода</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Всё временное возвращается после прохода; после аварийного завершения — при следующем запуске агента</text><text x="320.0" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="700" text-anchor="middle">подготовка</text><line x1="240" y1="128" x2="240" y2="420" stroke="#DDE2EA" stroke-width="1.5"/><text x="650.0" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="700" text-anchor="middle">проход</text><line x1="400" y1="128" x2="400" y2="420" stroke="#DDE2EA" stroke-width="1.5"/><text x="980.0" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="700" text-anchor="middle">очистка</text><line x1="900" y1="128" x2="900" y2="420" stroke="#DDE2EA" stroke-width="1.5"/><line x1="1060" y1="128" x2="1060" y2="420" stroke="#DDE2EA" stroke-width="1.5"/><text x="30" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">модуль dattobd загружен</text><rect x="240" y="152" width="790" height="22" rx="6" fill="#F1F3F6" stroke="#6B7684" stroke-width="1.5"/><text x="30" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">снапшоты и COW-файлы</text><rect x="330" y="196" width="620" height="22" rx="6" fill="#FDF1E3" stroke="#C46A00" stroke-width="1.5"/><text x="30" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">discard выключен, fstrim на паузе</text><rect x="250" y="240" width="740" height="22" rx="6" fill="#FDF1E3" stroke="#C46A00" stroke-width="1.5"/><text x="30" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">маршрут BBR до приёмника</text><rect x="260" y="284" width="750" height="22" rx="6" fill="#EAF0FD" stroke="#2458D6" stroke-width="1.5"/><text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">буферы в памяти (/dev/shm)</text><rect x="410" y="328" width="490" height="22" rx="6" fill="#EAF0FD" stroke="#2458D6" stroke-width="1.5"/><text x="30" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">юнит очистки копии</text><rect x="320" y="372" width="20" height="22" rx="6" fill="#F3ECFB" stroke="#7A3DB8" stroke-width="1.5"/><text x="330" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#7A3DB8" font-weight="400" text-anchor="start">существует миллисекунды: попадает только в копию диска</text><text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Агент только читает диск. Сам он записывает лишь служебные файлы: журнал /var/log/disk2rx.log и временные файлы в /run/disk2rx.</text><text x="30" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Постоянно на ВМ, пока агент установлен: /opt/disk2glance, сертификат и настройки в /etc/disk2glance (права 600),</text><text x="30" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">служба disk2rx-agent и исключение для needrestart. Всё это удаляет команда «Удалить агента».</text></svg>
