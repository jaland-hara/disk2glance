<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Что меняется на исходной ВМ во время прохода</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Временное возвращается после прохода; после аварийного завершения — при следующем запуске агента</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><text x="370.0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B6676" font-weight="700" text-anchor="middle">ПОДГОТОВКА</text><line x1="300" y1="122" x2="300" y2="392" stroke="#C9D1DC" stroke-width="1"/><text x="670.0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B6676" font-weight="700" text-anchor="middle">ПЕРЕДАЧА</text><line x1="440" y1="122" x2="440" y2="392" stroke="#C9D1DC" stroke-width="1"/><text x="970.0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B6676" font-weight="700" text-anchor="middle">ОЧИСТКА</text><line x1="900" y1="122" x2="900" y2="392" stroke="#C9D1DC" stroke-width="1"/><line x1="1040" y1="122" x2="1040" y2="392" stroke="#C9D1DC" stroke-width="1"/><text x="32" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">модуль dattobd загружен</text><rect x="300" y="142" width="730" height="18" rx="2" fill="#F6F7F9" stroke="#6B7684" stroke-width="1.2"/><text x="32" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">снапшоты и COW-файлы</text><rect x="360" y="184" width="580" height="18" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1.2"/><text x="32" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">discard выключен, fstrim на паузе</text><rect x="310" y="226" width="670" height="18" rx="2" fill="#FDF5EC" stroke="#B35A00" stroke-width="1.2"/><text x="32" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">маршрут BBR до приёмника</text><rect x="320" y="268" width="680" height="18" rx="2" fill="#F2F6FE" stroke="#2458D6" stroke-width="1.2"/><text x="32" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">буферы в памяти (/dev/shm)</text><rect x="440" y="310" width="460" height="18" rx="2" fill="#F2F6FE" stroke="#2458D6" stroke-width="1.2"/><text x="32" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">юнит очистки копии</text><rect x="352" y="352" width="16" height="18" rx="2" fill="#F6F2FB" stroke="#6B3FA0" stroke-width="1.2"/><text x="376" y="365" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B3FA0" font-weight="400" text-anchor="start">миллисекунды; остаётся только в копии диска</text><text x="32" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">Агент только читает диск. Сам он записывает лишь служебные файлы: журнал /var/log/disk2rx.log и временные файлы</text><text x="32" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">в /run/disk2rx. Пока агент установлен, на ВМ есть /opt/disk2glance, сертификат и настройки в /etc/disk2glance</text><text x="32" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">(права 600), служба disk2rx-agent и исключение для needrestart; всё это удаляет команда «Удалить агента».</text></svg>
