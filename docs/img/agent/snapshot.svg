<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#FFFFFF"/><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1C2430" font-weight="700" text-anchor="start">Снапшот: как сохраняется состояние диска</text><text x="32" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6676" font-weight="400" text-anchor="start">Приложения продолжают писать; агент читает диск таким, каким он был в момент снапшота</text><line x1="32" y1="80" x2="1168" y2="80" stroke="#C9D1DC" stroke-width="1"/><rect x="32" y="120" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="132.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Приложения</text><text x="132.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">продолжают работать</text><rect x="312" y="120" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="412.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Файловая система</text><text x="412.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">например, / на /dev/vda1</text><rect x="592" y="120" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#2458D6" stroke-width="1.4"/><text x="692.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">dattobd</text><text x="692.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">перехватывает запись</text><rect x="936" y="120" width="232" height="64" rx="3" fill="#FFFFFF" stroke="#B35A00" stroke-width="1.4"/><text x="1052.0" y="148.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">COW-файл .datto_d2g</text><text x="1052.0" y="167.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">старые версии блоков</text><rect x="592" y="280" width="200" height="64" rx="3" fill="#FFFFFF" stroke="#3A4556" stroke-width="1.4"/><text x="692.0" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">Диск /dev/vda1</text><text x="692.0" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">текущие данные</text><rect x="936" y="280" width="232" height="64" rx="3" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="1.4"/><text x="1052.0" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">/dev/datto1</text><text x="1052.0" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">диск на момент снапшота</text><rect x="936" y="410" width="232" height="52" rx="3" fill="#FFFFFF" stroke="#6B7684" stroke-width="1.4"/><text x="1052.0" y="432.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="700" text-anchor="middle">агент</text><text x="1052.0" y="451.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6676" font-weight="400" text-anchor="middle">только читает</text><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M232,152.0 L312,152.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m1)"/><text x="272" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="middle">запись</text><defs><marker id="m2" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M512,152.0 L592,152.0" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#B35A00"/></marker></defs><path d="M792,152.0 L936,152.0" fill="none" stroke="#B35A00" stroke-width="1.6" marker-end="url(#m3)"/><text x="864" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B35A00" font-weight="400" text-anchor="middle">старый блок —</text><text x="864" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#B35A00" font-weight="400" text-anchor="middle">перед перезаписью</text><defs><marker id="m4" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#3A4556"/></marker></defs><path d="M692.0,184 L692.0,280" fill="none" stroke="#3A4556" stroke-width="1.6" marker-end="url(#m4)"/><text x="704" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3A4556" font-weight="400" text-anchor="start">новый блок</text><defs><marker id="m5" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M792,312.0 L936,312.0" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m5)"/><text x="864" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1B7F3B" font-weight="400" text-anchor="middle">неизменённые</text><text x="864" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1B7F3B" font-weight="400" text-anchor="middle">блоки</text><defs><marker id="m6" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#1B7F3B"/></marker></defs><path d="M1052.0,184 L1052.0,280" fill="none" stroke="#1B7F3B" stroke-width="1.6" marker-end="url(#m6)"/><text x="1064" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1B7F3B" font-weight="400" text-anchor="start">изменённые блоки</text><defs><marker id="m7" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6B7684"/></marker></defs><path d="M1052.0,344 L1052.0,410" fill="none" stroke="#6B7684" stroke-width="1.6" marker-end="url(#m7)"/><text x="32" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">1. Перед снапшотом агент записывает кэш на диск (sync).</text><text x="32" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">2. На время создания снапшота запись</text><text x="32" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">    приостанавливается на 1–3 с.</text><text x="32" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1C2430" font-weight="400" text-anchor="start">3. Дальше приложения пишут как обычно.</text><text x="32" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B35A00" font-weight="400" text-anchor="start">Если COW-файл переполнится, снапшот перейдёт</text><text x="32" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B35A00" font-weight="400" text-anchor="start">в ошибку и проход прервётся. Рабочая файловая</text><text x="32" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B35A00" font-weight="400" text-anchor="start">система при этом не пострадает.</text></svg>
