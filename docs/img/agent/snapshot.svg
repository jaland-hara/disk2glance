<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#FFFFFF"/><text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1C2430" font-weight="700" text-anchor="start">Снапшот: как сохраняется состояние диска</text><text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6676" font-weight="400" text-anchor="start">Приложения продолжают писать; агент читает диск таким, каким он был в момент снапшота</text><rect x="40" y="120" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="150.0" y="144" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Приложения</text><text x="150.0" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">продолжают работать</text><rect x="40" y="250" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="150.0" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Файловая система</text><text x="150.0" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">например, / на /dev/vda1</text><rect x="340" y="250" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="465.0" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">dattobd</text><text x="465.0" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">перехватывает запись</text><rect x="340" y="400" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="465.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">Диск /dev/vda1</text><text x="465.0" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">текущие данные</text><rect x="680" y="400" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#C46A00" stroke-width="2"/><text x="805.0" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">COW-файл /.datto_d2g</text><text x="805.0" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">старые версии блоков</text><rect x="900" y="180" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#1B7F3B" stroke-width="2"/><text x="1030.0" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">/dev/datto1</text><text x="1030.0" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">диск на момент снапшота</text><text x="1030.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6676" font-weight="400" text-anchor="middle">только чтение</text><rect x="900" y="100" width="260" height="50" rx="10" fill="#F7F8FA" stroke="#6B7684" stroke-width="2"/><text x="1030.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1C2430" font-weight="700" text-anchor="middle">агент</text><defs><marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M150,190 L150,250" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a1)"/><rect x="122.4" y="199.0" width="55.2" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="150.0" y="212.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">запись</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M260,285 L340,285" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a2)"/><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><path d="M465,320 L465,400" fill="none" stroke="#3A4556" stroke-width="2.5" marker-end="url(#a3)"/><rect x="423.0" y="339.0" width="84.0" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="465.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3A4556" font-weight="400" text-anchor="middle">новый блок</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C46A00"/></marker></defs><path d="M560,320 L560,360 L805,360 L805,400" fill="none" stroke="#C46A00" stroke-width="2.5" marker-end="url(#a4)"/><rect x="561.6" y="323" width="256.8" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="690" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C46A00" font-weight="400" text-anchor="middle">старый блок — до первой перезаписи</text><defs><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M590,435 L640,435 L640,240 L900,240" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a5)"/><rect x="689.2" y="211" width="141.6" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="760" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1B7F3B" font-weight="400" text-anchor="middle">неизменённые блоки</text><defs><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker></defs><path d="M930,400 L1000,270" fill="none" stroke="#1B7F3B" stroke-width="2.5" marker-end="url(#a6)"/><defs><marker id="a7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7684"/></marker></defs><path d="M1030,180 L1030,150" fill="none" stroke="#6B7684" stroke-width="2.5" marker-end="url(#a7)"/><rect x="1062.4" y="151" width="55.2" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1090" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7684" font-weight="400" text-anchor="middle">читает</text><text x="40" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1C2430" font-weight="400" text-anchor="start">Перед снапшотом агент сбрасывает кэш на диск (sync); на время создания снапшота запись приостанавливается на 1–3 с.</text><text x="40" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#C46A00" font-weight="400" text-anchor="start">Если COW-файл переполнится, снапшот перейдёт в ошибку, проход прервётся, а рабочая файловая система не пострадает.</text></svg>
